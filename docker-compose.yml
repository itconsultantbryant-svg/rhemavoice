services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rhema
      POSTGRES_PASSWORD: rhema
      POSTGRES_DB: rhemavoice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhema -d rhemavoice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://rhema:rhema@db:5432/rhemavoice
      REDIS_URL: redis://redis:6379/0
      DEBUG: "1"
      SECRET_KEY: dev-secret-key-change-in-prod
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      OTP_DEBUG: "1"
      OTP_CODE: "123456"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://rhema:rhema@db:5432/rhemavoice
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-prod
      DEBUG: "1"
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis

volumes:
  pgdata:
